name: Deploy SamCoupeWeb to Pages

on:
  push:
    branches: ["main"]
  # World of SAM warns its internal file/image URLs can change without notice.
  # Rebuild the catalogue snapshot every week so cached links expire quickly.
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.53 # Matching a stable version

      - name: Verify Emscripten
        run: emcc -v

      - name: Build WASM
        run: |
          chmod +x package/make_wasm_release.sh
          ./package/make_wasm_release.sh

      - name: Refresh World of SAM catalogue
        run: node tools/build-library.mjs

      - name: Refresh experimental Outsoftware catalogue
        run: node tools/build-outsoftware.mjs

      - name: Prefetch Outsoftware downloads
        run: node tools/prefetch-media.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'wasm/deploy'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
